name: Build SpendWise Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/expense-tracker/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend/expense-tracker
        run: npm ci

      - name: Build frontend
        working-directory: frontend/expense-tracker
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}

      - name: Sync Capacitor Android project
        working-directory: frontend/expense-tracker
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/expense-tracker/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-debug-apk
          path: frontend/expense-tracker/android/app/build/outputs/apk/debug/app-debug.apk